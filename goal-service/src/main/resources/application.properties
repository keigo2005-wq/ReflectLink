# Renderなど、実行環境がPORTを指定してくる場合はそちらを優先する
server.port=${PORT:8080}

# DB_USER・DB_PASSWORDは環境変数で指定する(このファイルには書かない)。
# 例(ローカル開発時、PowerShellで起動前に実行):
#   $env:DB_USER = "root"
#   $env:DB_PASSWORD = "root"
# 本番(Render)ではDB_URLをPostgreSQLの接続文字列に差し替える。
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/reflectlink?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# スキーマは手動管理するため自動生成はしない(MySQLはリポジトリ直下のschema.sql、
# PostgreSQLはgoal-service/schema.postgres.sqlを参照)
spring.jpa.hibernate.ddl-auto=none
# ダイアレクトは指定せず、接続先(MySQL/PostgreSQL)からHibernateに自動判定させる
spring.jpa.open-in-view=false
