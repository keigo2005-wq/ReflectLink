server.port=8080

# DB_USER・DB_PASSWORDは環境変数で指定する(このファイルには書かない)。
# 例(ローカル開発時、PowerShellで起動前に実行):
#   $env:DB_USER = "root"
#   $env:DB_PASSWORD = "root"
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/reflectlink?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# スキーマはmigration_action_plans.sqlで手動管理するため自動生成はしない
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
